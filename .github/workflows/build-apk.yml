name: Construire APK Israël_AI Le Livre

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  creer-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            platforms;android-36
            build-tools;35.0.0
            build-tools;36.0.0

      - name: Trouver le ZIP du livre
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucun fichier ZIP trouvé."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extraire le projet
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f -name "package.json" -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : package.json introuvable dans le ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Projet trouvé dans : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Installer les dépendances
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Vérifier Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap --version

      - name: Ajouter Android à Capacitor si nécessaire
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Le dossier Android existe déjà."
          fi

      - name: Synchroniser Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Israel_AI_Le_Livre_APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

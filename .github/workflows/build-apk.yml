name: Construire APK Israël_AI — Le Livre

on:
  workflow_dispatch:
  push:
    paths:
      - "Israël_AI_Livre_APK_projet.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Extraire le projet
        run: |
          unzip -q "Israël_AI_Livre_APK_projet.zip" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name package.json -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet trouvé dans : $PROJECT_DIR"

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install

      - name: Créer le projet Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap add android

      - name: Synchroniser Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap sync android

      - name: Construire l'APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Israel_AI_Le_Livre_APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk

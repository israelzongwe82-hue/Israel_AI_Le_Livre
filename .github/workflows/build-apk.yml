name: Construire APK Israël_AI Le Livre

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  creer-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Préparer le SDK Android
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERREUR : sdkmanager introuvable"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Trouver le ZIP du livre
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun fichier ZIP trouvé"
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"
          echo "ZIP_LIVRE=$ZIP" >> "$GITHUB_ENV"

      - name: Extraire le projet
        shell: bash
        run: |
          rm -rf projet
          mkdir projet
          unzip -q "$ZIP_LIVRE" -d projet

      - name: Trouver le dossier de l'application
        shell: bash
        run: |
          if [ -f "projet/package.json" ]; then
            APP_DIR="projet"
          else
            APP_DIR=$(find projet -name package.json -not -path "*/node_modules/*" -printf '%h\n' | head -n 1)
          fi

          if [ -z "$APP_DIR" ]; then
            echo "ERREUR : package.json introuvable"
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Installer les dépendances
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Installer Capacitor si nécessaire
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          if [ -f capacitor.config.json ] || [ -f capacitor.config.ts ]; then
            echo "Capacitor déjà configuré."
          else
            npm install @capacitor/core @capacitor/cli @capacitor/android
            npx cap init "Israël_AI" "com.israelzongwe.israelai" --web-dir .
          fi

      - name: Ajouter Android à Capacitor si nécessaire
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Synchroniser Capacitor
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx cap sync android

      - name: Construire l'APK
        working-directory: ${{ env.APP_DIR }}/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Israel_AI_Le_Livre_APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

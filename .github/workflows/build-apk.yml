name: Construire APK Israël_AI Le Livre

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  creer-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Trouver et extraire le ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Aucun fichier ZIP trouvé."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -name package.json -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json introuvable dans le ZIP."
            exit 1
          fi

          echo "Projet trouvé : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Android
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Ajouter Android à Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Synchroniser Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Israel_AI_Le_Livre_APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk

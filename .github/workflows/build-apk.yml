name: Construire APK Israël_AI Le Livre

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  creer-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer Android
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Trouver le ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucun fichier ZIP trouvé."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extraire le projet
        shell: bash
        run: |
          rm -rf projet
          mkdir projet

          unzip -q "$ZIP_FILE" -d projet

          echo "Contenu extrait :"
          find projet -maxdepth 2 -type f | head -100

      - name: Trouver package.json
        shell: bash
        run: |
          PACKAGE=$(find projet -type f -name "package.json" \
            -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERREUR : package.json introuvable."
            exit 1
          fi

          APP_DIR=$(dirname "$PACKAGE")

          echo "Application trouvée dans : $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Vérifier la configuration Capacitor
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          if [ -f "capacitor.config.json" ]; then
            echo "capacitor.config.json trouvé."
          elif [ -f "capacitor.config.ts" ]; then
            echo "capacitor.config.ts trouvé."
          elif [ -f "capacitor.config.js" ]; then
            echo "capacitor.config.js trouvé."
          else
            echo "ERREUR : configuration Capacitor introuvable."
            exit 1
          fi

      - name: Installer les dépendances
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Vérifier Capacitor
        working-directory: ${{ env.APP_DIR }}
        run: npx cap --version

      - name: Ajouter Android si nécessaire
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          if [ -d "android" ]; then
            echo "Le dossier Android existe déjà."
          else
            npx cap add android
          fi

      - name: Synchroniser Android
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Construire APK Debug
        working-directory: ${{ env.APP_DIR }}/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Israel_AI_Le_Livre_APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
